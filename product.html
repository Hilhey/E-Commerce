<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Produk - Bisnis Digital Store</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="sub-hero">
        <nav class="navbar">
            <a class="logo" href="index.html">Bisnis<span>Digital</span></a>
            <div class="nav-actions">
                <a class="ghost-btn" href="index.html">Kembali</a>
            </div>
        </nav>
    </header>

    <main class="section product-detail" id="productDetail">
        <div class="detail-image">
            <img id="productImage" src="" alt="Produk" />
        </div>
        <div class="detail-info">
            <span class="tag" id="productCategory">Digital</span>
            <h1 id="productName">Memuat...</h1>
            <p id="productDescription">Silakan tunggu, detail produk sedang disiapkan.</p>
            <div class="detail-price" id="productPrice">Rp 0</div>
            <button class="primary-btn add-to-cart" id="productAdd" data-id="" data-name="" data-price="">Tambah ke Keranjang</button>
        </div>
    </main>

    <script src="assets/js/app.js"></script>
</body>
</html>
